<html lang="nl">
<head>

<meta property="og:description" content="Geen idee wat je vanavond eet? Beantwoord een paar vragen en ik raad het.">

<style>
:root{
  --bg:#F5C542; --ink:#2B1633; --soft:#5a3f5f; --card:#FFFDF6; --line:#2B1633;
  --yes:#1F7A4D; --no:#B7321F; --pot:#2B1633; --steam:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#241129; --ink:#FBE7A1; --soft:#d9c28a; --card:#351C3C; --line:#FBE7A1;
    --yes:#3FAE76; --no:#E0604B; --pot:#FBE7A1; --steam:#FBE7A1;
  }
}
:root[data-theme="dark"]{
  --bg:#241129; --ink:#FBE7A1; --soft:#d9c28a; --card:#351C3C; --line:#FBE7A1;
  --yes:#3FAE76; --no:#E0604B; --pot:#FBE7A1; --steam:#FBE7A1;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 18px 40px}
h1,h2,.q{font-family:"Young Serif",Georgia,"Times New Roman",serif;font-weight:400}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:1.35rem;margin:0}
.link{background:none;border:0;color:var(--ink);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 2px}
.stage{display:flex;flex-direction:column;align-items:center;margin-top:10px}
svg.geest{width:180px;height:auto;overflow:visible}
.steam path{fill:none;stroke:var(--steam);stroke-width:5;stroke-linecap:round;opacity:.85}
@media (prefers-reduced-motion:no-preference){
  .steam path{animation:rise 2.6s ease-in-out infinite}
  .steam path:nth-child(2){animation-delay:.6s}
  .steam path:nth-child(3){animation-delay:1.2s}
  .thinking .pupil{animation:look 1.6s ease-in-out infinite}
}
@keyframes rise{0%{transform:translateY(6px);opacity:0}40%{opacity:.9}100%{transform:translateY(-14px);opacity:0}}
@keyframes look{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.bubble{position:relative;background:var(--card);border:2.5px solid var(--line);border-radius:22px;padding:22px 20px 20px;width:100%;margin-top:6px}
.bubble::before{content:"";position:absolute;top:-13px;left:50%;width:22px;height:22px;background:var(--card);border-left:2.5px solid var(--line);border-top:2.5px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.count{font-size:.9rem;color:var(--soft);margin:0 0 6px}
.q{font-size:1.55rem;line-height:1.25;margin:0 0 18px}
.answers{display:grid;gap:9px}
.answers button,.btn{font:inherit;font-weight:600;border:2.5px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:12px 16px;text-align:left;cursor:pointer;transition:background .15s,transform .1s}
.answers button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.answers button:active,.btn:active{transform:scale(.98)}
.answers .a-yes{background:var(--yes);border-color:var(--yes);color:#fff}
.answers .a-no{background:var(--no);border-color:var(--no);color:#fff}
.answers .a-yes:hover{background:var(--yes)} .answers .a-no:hover{background:var(--no)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.meter{margin-top:18px;display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--soft)}
.meter .bar{flex:1;height:8px;border-radius:8px;background:color-mix(in srgb,var(--ink) 15%,transparent);overflow:hidden}
.meter .fill{height:100%;background:var(--ink);width:0;transition:width .4s}
.guess{text-align:center}
.guess .emoji{font-size:4.2rem;line-height:1;margin:4px 0 8px}
.guess h2{font-size:2rem;line-height:1.15;margin:0 0 8px}
.guess p{margin:0 auto 18px;max-width:34ch;color:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row .btn{text-align:center;flex:1 1 140px}
.btn.primary{background:var(--yes);border-color:var(--yes);color:#fff}
.alts{margin-top:20px;text-align:left;border-top:2px dashed color-mix(in srgb,var(--ink) 35%,transparent);padding-top:14px}
.alts h3{font-size:1rem;margin:0 0 8px}
.alts ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.alts li{display:flex;gap:10px;align-items:center}
.intro p{margin:0 0 18px}
.foot{margin-top:18px;text-align:center;font-size:.85rem;color:var(--soft)}
.remark{font-style:italic;color:var(--soft);margin:0 0 10px;min-height:1.5em}
.gut{font-size:.92rem;font-style:italic;border-left:3px solid var(--ink);text-align:left;padding-left:10px;max-width:36ch}
.alt{font:inherit;background:none;border:0;color:var(--ink);display:flex;gap:10px;align-items:center;padding:4px 0;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.copy{text-align:center;font-size:.8rem;color:var(--soft);margin:6px 0 0;opacity:.85}
.row a.btn{text-decoration:none;display:inline-block}
.tools{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.field{font:inherit;width:100%;padding:12px 14px;border:2.5px solid var(--line);border-radius:14px;background:transparent;color:var(--ink)}
.field::placeholder{color:var(--soft);opacity:.8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stats div{border:2px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stats b{display:block;font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.5rem}
.stats span{font-size:.8rem;color:var(--soft);line-height:1.2;display:block}
</style>
</head>

<main>
  <header>
    <h1>De Kookinator</h1>

  <p class="foot" id="foot">Denk niet te lang na. Je buik weet het antwoord al.</p>

</main>

// ---------- Gerechten opbouwen ----------
function parseTags(tags){
  const v={};
  tags.split(" ").forEach(x=>{ if(x.startsWith("?")) v[x.slice(1)]=0.5; else v[x]=1; });
  if(!("vega" in v)) v.vega = MEATS.some(m=>v[m]===1) ? 0 : 0.5;
  if(!("vegan" in v)) v.vegan = v.vega===1 ? (v.kaas?0:0.3) : 0;
  return v;
}
let DISHES=[];
function buildDishes(){
  const base=RAW.map(([name,emoji,desc,tags],i)=>({key:name,nl:[name,desc],en:EN[i],emoji,v:parseTags(tags)}));
  const custom=store.get("kookinator-custom",[]).map(c=>({key:c.name,nl:[c.name,null],en:[c.name,null],emoji:"🍽️",v:c.v,custom:true}));
  DISHES=base.concat(custom);
}
const dName=d=>d[LANG][0];
const dDesc=d=>d[LANG][1]||t("customDesc");
buildDishes();

// ---------- Context: dag en tijd ----------
const now=new Date(), day=now.getDay(), hour=now.getHours();
const CONTEXT=[];
if(day===5||day===6) CONTEXT.push({fx:{bestellen:.5,luxe:.4,comfort:.3,delen:.3},say:"ctxWeekend"});
else if(day===1) CONTEXT.push({fx:{gezond:.4,goedkoop:.3},say:"ctxMonday"});
if(hour>=20) CONTEXT.push({fx:{snel:.6,bestellen:.4,stoof:-.8,oven:-.3},say:"ctxLate"});

// ---------- Staat ----------
let events=[], moodQueue=[], redraw=()=>{};
const ANSVAL=[1,0.75,null,0.25,0];
const ANSCLS=["a-yes","","","","a-no"];

const panel=document.getElementById("panel");
const geest=document.getElementById("geest");
const mouth=document.getElementById("mouth");
const restartBtn=document.getElementById("restart");
const statsBtn=document.getElementById("statsBtn");
const langBtn=document.getElementById("langBtn");

const val=(d,k)=>d.v[k] ?? 0;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function applyFx(p,fx,strength){
  DISHES.forEach((d,i)=>{
    if(!p[i]) return;
    let s=0; for(const k in fx) s+=fx[k]*val(d,k);
    p[i]*=Math.exp(s*strength);
  });
}

function probs(){
  const p=DISHES.map(()=>1);
  CONTEXT.forEach(c=>applyFx(p,c.fx,0.5));
  for(const e of events){
    if(e.t==="reject"){
      p[e.i]=0;
      const d=DISHES[e.i];
      if(e.reason==="zwaar") applyFx(p,{comfort:-1,licht:1,kaas:-.4},0.9);
      if(e.reason==="werk") applyFx(p,{snel:1,eenpan:.6,bestellen:.6,stoof:-1,oven:-.4},0.9);
      if(e.reason==="smaak"){
        const fx={}; CUISINES.forEach(c=>{if(val(d,c)) fx[c]=-1.4;});
        MEATS.forEach(m=>{if(val(d,m)===1) fx[m]=-.8;});
        ["rijst","pasta","noodles","aardappel","soep"].forEach(b=>{if(val(d,b)===1) fx[b]=(fx[b]||0)-.6;});
        applyFx(p,fx,1);
      }
      continue;
    }
    if(e.val===null) continue;
    if(e.mood){
      const a=(e.val-0.5)*2;
      applyFx(p,MOOD[e.key].fx,a>0?a*0.9:a*0.35);
      continue;
    }
    if(isSoft(e.key) && e.val<0.5) continue;
    DISHES.forEach((d,i)=>{
      if(!p[i]) return;
      p[i]*=Math.max(0.07,1-Math.abs(e.val-val(d,e.key))*0.93);
    });
  }
  const s=p.reduce((x,y)=>x+y,0)||1;
  return p.map(x=>x/s);
}

function bestQuestion(p){
  const asked=new Set(events.filter(e=>e.t==="q"&&!e.mood).map(e=>e.key));
  let best=null,bestScore=0.015;
  for(const k in QUESTIONS){
    if(asked.has(k)) continue;
    let yes=0; DISHES.forEach((d,i)=>yes+=p[i]*val(d,k));
    const score=yes*(1-yes);
    if(score>bestScore){bestScore=score;best=k;}
  }
  return best;
}

const ranked=p=>DISHES.map((d,i)=>({d,i,p:p[i]})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p);
const qCount=()=>events.filter(e=>e.t==="q").length;
function sinceGuess(){ let n=0; for(let j=events.length-1;j>=0;j--){ if(events[j].t==="reject") break; if(!events[j].mood) n++; } return n; }
const rejections=()=>events.filter(e=>e.t==="reject").length;

function face(mode){
  geest.classList.toggle("thinking",mode==="think");
  mouth.setAttribute("d", mode==="happy" ? "M84 132q16 16 32 0" : mode==="sad" ? "M88 142q12-9 24 0" : mode==="sly" ? "M88 138q14 4 24-6" : "M88 136q12 8 24 0");
}

function remark(conf){
  const last=events[events.length-1];
  if(!last) return CONTEXT.length ? CONTEXT.map(c=>t(c.say)).join(" ") : t("first")[0];
  if(last.t==="reject") return t("reasonSay")[last.reason];
  if(last.mood && last.val!==null) return MOOD[last.key][LANG][last.val>=0.5?1:2];
  if(conf>0.5) return rnd(t("high"));
  if(conf>0.3) return rnd(t("mid"));
  return rnd(t("low"));
}

// ---------- Statistieken ----------
function loadStats(){ return store.get("kookinator-stats",{games:0,first:0,questions:0,dishes:{}}); }
function record(d,firstTry){
  const s=loadStats();
  s.games++; if(firstTry) s.first++; s.questions+=qCount();
  s.dishes[d.key]=(s.dishes[d.key]||0)+1;
  store.set("kookinator-stats",s);
}

// ---------- Schermen ----------
function step(){
  const p=probs(), r=ranked(p);
  if(!r.length) return noMore();
  const top=r[0];
  if(moodQueue.length && !rejections()){
    const moodAsked=events.filter(e=>e.mood).length;
    if(moodAsked<moodQueue.length && (moodAsked<2 || qCount()===6)) return ask(moodQueue[moodAsked],true,top.p);
  }
  const q=bestQuestion(p), n=sinceGuess();
  const ready=(n>=4 && top.p>0.45) || n>=(rejections()?5:15) || !q;
  if(ready) return showGuess(top,r);
  ask(q,false,top.p);
}

function ask(key,mood,conf){
  let rem=remark(conf);
  redraw=()=>{rem=remark(conf);render();};
  function render(){
    face(mood?"sly":"think");
    const n=qCount();
    restartBtn.hidden=n===0;
    const text=mood?MOOD[key][LANG][0]:qText(key);
    const labels=mood?t("moodAnswers"):t("answers");
    panel.innerHTML=`
      <p class="remark">${esc(rem)}</p>
      <p class="count">${t("question")(n+1)}</p>
      <p class="q">${esc(text)}</p>
      <div class="answers">${labels.map((l,i)=>`<button data-i="${i}" class="${ANSCLS[i]}">${l}</button>`).join("")}</div>
      <div class="meter"><span>${t("sure")}</span><div class="bar"><div class="fill" style="width:${Math.round(Math.min(1,conf*1.6)*100)}%"></div></div>
      ${n?`<button class="link" id="back">${t("back")}</button>`:""}</div>`;
    panel.querySelectorAll(".answers button").forEach(b=>b.onclick=()=>{
      events.push({t:"q",key,val:ANSVAL[b.dataset.i],mood}); step();
    });
    const back=document.getElementById("back");
    if(back) back.onclick=()=>{
      while(events.length && events[events.length-1].t!=="q") events.pop();
      events.pop(); step();
    };
    panel.querySelector(".answers button").focus({preventScroll:true});
  }
  render();
}

function showGuess(top,r){
  const alts=r.slice(1,4).filter(x=>x.p>0.03);
  redraw=render;
  function render(){
    face("happy"); restartBtn.hidden=false;
    panel.innerHTML=`
      <div class="guess">
        <p class="count">${t("think")}</p>
        <div class="emoji">${top.d.emoji}</div>
        <h2>${esc(dName(top.d))}</h2>
        <p>${esc(dDesc(top.d))}</p>
        <p class="gut">${t("gut")}</p>
        <div class="row">
          <button class="btn primary" id="yes">${t("yes")}</button>
          <button class="btn" id="no">${t("no")}</button>
        </div>
        ${alts.length?`<div class="alts"><h3>${t("alts")}</h3><ul>${alts.map(a=>`<li><button class="alt" data-i="${a.i}"><span>${a.d.emoji}</span><span>${esc(dName(a.d))}</span></button></li>`).join("")}</ul></div>`:""}
        <div class="row" style="margin-top:14px"><button class="link" id="iknow">${t("iKnow")}</button></div>
      </div>`;
    document.getElementById("yes").onclick=()=>done(top.d,!rejections());
    document.getElementById("no").onclick=()=>whyNot(top);
    document.getElementById("iknow").onclick=teach;
    panel.querySelectorAll(".alt").forEach(b=>b.onclick=()=>done(DISHES[b.dataset.i],false));
    document.getElementById("yes").focus({preventScroll:true});
  }
  render();
}

function whyNot(top){
  redraw=render;
  function render(){
    face("think");
    panel.innerHTML=`
      <p class="remark">${esc(t("notThis")(dName(top.d)))}</p>
      <p class="q">${t("whatWrong")}</p>
      <div class="answers">${Object.entries(t("reasons")).map(([k,l])=>`<button data-k="${k}">${l}</button>`).join("")}</div>
      <div class="row" style="margin-top:14px"><button class="link" id="iknow">${t("iKnow")}</button></div>`;
    panel.querySelectorAll(".answers button").forEach(b=>b.onclick=()=>{
      events.push({t:"reject",i:top.i,reason:b.dataset.k}); step();
    });
    document.getElementById("iknow").onclick=teach;
    panel.querySelector(".answers button").focus({preventScroll:true});
  }
  render();
}

// Leer een nieuw gerecht op basis van de antwoorden tot nu toe
function teach(){
  const back=redraw;
  redraw=render;
  function render(){
    face("sly");
    const opts=DISHES.map(d=>`<option value="${esc(dName(d))}">`).join("");
    panel.innerHTML=`
      <p class="q">${t("teachQ")}</p>
      <p>${t("teachP")}</p>
      <input id="dish" class="field" list="dishlist" maxlength="60" placeholder="${esc(t("teachPh"))}" autocomplete="off">
      <datalist id="dishlist">${opts}</datalist>
      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="save">${t("save")}</button>
        <button class="btn" id="cancel">${t("cancel")}</button>
      </div>`;
    const inp=document.getElementById("dish");
    inp.focus();
    const go=()=>{
      const name=inp.value.trim(); if(!name) return inp.focus();
      const found=DISHES.find(d=>d.nl[0].toLowerCase()===name.toLowerCase()||d.en[0].toLowerCase()===name.toLowerCase());
      if(found) return done(found,false);
      const v={}; Object.keys(QUESTIONS).forEach(k=>v[k]=0.5);
      events.filter(e=>e.t==="q"&&!e.mood&&e.val!==null).forEach(e=>{
        if(isSoft(e.key)&&e.val<0.5) return;
        v[e.key]=e.val>=0.5?1:0;
      });
      if(MEATS.some(m=>v[m]===1)){v.vega=0;v.vegan=0;}
      const list=store.get("kookinator-custom",[]);
      list.push({name,v}); store.set("kookinator-custom",list);
      buildDishes();
      const d=DISHES[DISHES.length-1];
      done(d,false,true);
    };
    document.getElementById("save").onclick=go;
    inp.onkeydown=e=>{if(e.key==="Enter")go();};
    document.getElementById("cancel").onclick=()=>back();
  }
  render();
}

function done(d,firstTry,learned){
  record(d,firstTry);
  const n=qCount();
  redraw=render;
  function render(){
    face("happy");
    panel.innerHTML=`
      <div class="guess">
        <div class="emoji">${d.emoji}</div>
        <h2>${t("enjoy")}</h2>
        <p>${esc(learned?t("learned")(dName(d)):t("guessedIn")(dName(d),n))}</p>
        <div class="row">
          <a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(t("recipeQ")+" "+dName(d))}">${t("recipe")}</a>
          <button class="btn" id="share">${t("share")}</button>
        </div>
        <div class="row" style="margin-top:10px"><button class="btn" id="again">${t("again")}</button></div>
      </div>`;
    document.getElementById("again").onclick=reset;
    const sb=document.getElementById("share");
    sb.onclick=async()=>{
      const text=t("shareText")(n,dName(d),d.emoji);
      const url=location.href.split("#")[0];
      try{
        if(navigator.share){ await navigator.share({title:"De Kookinator",text,url}); return; }
        await navigator.clipboard.writeText(text+" "+url);
        sb.textContent=t("copied");
      }catch(e){ if(e&&e.name!=="AbortError") sb.textContent=t("copyFail"); }
    };
  }
  render();
}

function noMore(){
  redraw=render;
  function render(){
    face("sad");
    panel.innerHTML=`
      <div class="guess">
        <div class="emoji">🤷</div>
        <h2>${t("noMoreH")}</h2>
        <p>${t("noMoreP")}</p>
        <div class="row">
          <button class="btn primary" id="teach">${t("teachBtn")}</button>
          <button class="btn" id="again">${t("restart")}</button>
        </div>
      </div>`;
    document.getElementById("teach").onclick=teach;
    document.getElementById("again").onclick=reset;
  }
  render();
}

function showStats(){
  const back=redraw;
  let confirmReset=false;
  redraw=render;
  function render(){
    face("idle");
    const s=loadStats();
    const pct=s.games?Math.round(s.first/s.games*100)+"%":"–";
    const avg=s.games?(s.questions/s.games).toFixed(1).replace(".",LANG==="nl"?",":"."):"–";
    const byKey=Object.fromEntries(DISHES.map(d=>[d.key,d]));
    const top=Object.entries(s.dishes).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const custom=store.get("kookinator-custom",[]);
    panel.innerHTML=`
      <p class="q">${t("statsH")}</p>
      <div class="stats">
        <div><b>${s.games}</b><span>${t("sGames")}</span></div>
        <div><b>${pct}</b><span>${t("sFirst")}</span></div>
        <div><b>${avg}</b><span>${t("sAvg")}</span></div>
      </div>
      <div class="alts"><h3>${t("sTop")}</h3>${top.length?`<ul>${top.map(([k,c])=>{const d=byKey[k];return `<li><span>${d?d.emoji:"🍽️"}</span><span>${esc(d?dName(d):k)} (${c}×)</span></li>`;}).join("")}</ul>`:`<p>${t("sNone")}</p>`}</div>
      <div class="alts"><h3>${t("sCustom")}</h3>${custom.length?`<ul>${custom.map((c,i)=>`<li><span>🍽️</span><span style="flex:1">${esc(c.name)}</span><button class="link" data-del="${i}">${t("sDel")}</button></li>`).join("")}</ul>`:`<p>${t("sNone")}</p>`}</div>
      <p class="count" style="margin-top:14px">${t("statsNote")}</p>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="sback">${t("back")}</button>
        <button class="btn" id="sreset">${confirmReset?t("sResetConfirm"):t("sReset")}</button>
      </div>`;
    panel.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      const list=store.get("kookinator-custom",[]); list.splice(+b.dataset.del,1);
      store.set("kookinator-custom",list); buildDishes(); render();
    });
    document.getElementById("sback").onclick=()=>{ statsBtn.hidden=false; back(); };
    document.getElementById("sreset").onclick=()=>{
      if(!confirmReset){confirmReset=true;return render();}
      store.set("kookinator-stats",{games:0,first:0,questions:0,dishes:{}});
      store.set("kookinator-custom",[]); buildDishes(); confirmReset=false; render();
    };
  }
  statsBtn.hidden=true;
  render();
}

function intro(){
  redraw=render;
  function render(){
    face("idle"); restartBtn.hidden=true;
    panel.innerHTML=`
      <div class="intro">
        <p class="q">${t("introQ")}</p>
        <p>${t("intro")(DISHES.length)}</p>
        <div class="row"><button class="btn primary" id="start">${t("start")}</button></div>
      </div>`;
    document.getElementById("start").onclick=step;
  }
  render();
}

function applyLang(){
  document.documentElement.lang=LANG;
  document.title=LANG==="en"?"The Kookinator – what should I eat tonight?":"De Kookinator – wat eet ik vanavond?";
  restartBtn.textContent=t("restart");
  statsBtn.textContent=t("stats");
  langBtn.textContent=t("langBtn");
  langBtn.setAttribute("aria-label",LANG==="en"?"Nederlands":"English");
  document.getElementById("foot").textContent=t("foot");
  document.getElementById("copy").textContent=t("copy");
}
langBtn.onclick=()=>{ LANG=LANG==="nl"?"en":"nl"; store.set("kookinator-lang",LANG); applyLang(); redraw(); };
statsBtn.onclick=showStats;

function reset(){
  events=[];
  statsBtn.hidden=false;
  const keys=Object.keys(MOOD).sort(()=>Math.random()-.5);
  const m=now.getMonth();
  moodQueue=keys.filter(k=>!(k==="weer"&&m>=5&&m<=7)).slice(0,3);
  intro();
}
restartBtn.onclick=reset;
applyLang();
reset();
</script>
